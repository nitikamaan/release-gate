name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 24f3003527@ds.study.iitm.ac.in
        run: echo "TDS identity verified"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test release gate
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)

          payload = {
              "target": "preview",
              "event": "pull_request",
              "ref": "refs/heads/feature",
              "workflow": {
                  "trigger": "pull_request",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      }
                  ]
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          response = client.post("/release-gate", json=payload)

          assert response.status_code == 200

          result = response.json()

          assert result["decision"] == "promote"
          assert result["violations"] == []

          print("Release gate test passed")
          PY