name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 24f3003527@ds.study.iitm.ac.in"
        run: echo "TDS identity verified"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test release gate
        run: |
          python -c "from fastapi.testclient import TestClient; from main import app; c=TestClient(app); p={'target':'preview','event':'pull_request','ref':'refs/heads/feature','workflow':{'trigger':'pull_request','permissions':{'contents':'read','packages':'write','id-token':'none'},'testsPassed':True,'matrixComplete':True,'failFast':False,'actions':[{'owner':'actions','name':'checkout','ref':'v4'}]},'image':{'multiStage':True,'runsAsRoot':False,'secretMode':'none','criticalVulnerabilities':0,'digestPinned':True}}; r=c.post('/release-gate',json=p); print(r.json()); assert r.status_code==200; assert r.json()['decision']=='promote'; assert r.json()['violations']==[]"